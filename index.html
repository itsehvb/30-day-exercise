<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30-Day Knee &amp; Posture</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A 30-day home program: knee days, posture days and rest days, with a video or photo for every exercise.">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="30-Day Plan">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1d2327; --muted:#59636b; --line:#e1ded5; --media:#ebe8e0;
  --knee:#0a7d77; --knee-ink:#06635e; --knee-soft:#ddf1ee;
  --post:#5a4fcf; --post-ink:#4438b5; --post-soft:#ebe9fc;
  --rest:#69737c; --rest-ink:#4f5860; --rest-soft:#eceeef;
  --on-accent:#ffffff; --note:#fff4d6; --note-ink:#6b4e00;
  --fig:#36434d; --fig-far:#a3aeb6; --prop:#c2b6a0;
  --accent:var(--knee); --accent-ink:var(--knee-ink); --accent-soft:var(--knee-soft);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111417; --card:#1a1e22; --ink:#e8eaeb; --muted:#a4acb2; --line:#2c3237; --media:#23282d;
    --knee:#3cc5bc; --knee-ink:#6fdcd4; --knee-soft:#15302e;
    --post:#a39bff; --post-ink:#bdb7ff; --post-soft:#262341;
    --rest:#9aa3ac; --rest-ink:#c2c9cf; --rest-soft:#23282d;
    --on-accent:#0b1416; --note:#3a3015; --note-ink:#f3d98a;
    --fig:#d6dce1; --fig-far:#66717a; --prop:#8c816d;
  }
}
.t-knee{--accent:var(--knee); --accent-ink:var(--knee-ink); --accent-soft:var(--knee-soft)}
.t-post{--accent:var(--post); --accent-ink:var(--post-ink); --accent-soft:var(--post-soft)}
.t-rest{--accent:var(--rest); --accent-ink:var(--rest-ink); --accent-soft:var(--rest-soft)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
main.wide{max-width:1120px}
h1{font-size:28px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.3;margin:28px 0 12px}
h3{font-size:19px;line-height:1.3;margin:0}
p{margin:0 0 12px}
a{color:var(--accent-ink)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 20px;border-radius:14px;border:2px solid transparent;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;color:inherit;background:var(--card)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:var(--line)}
.btn.block{display:flex;width:100%}
.btn:focus-visible,.day:focus-visible,.tabs a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-weight:700;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em;font-size:16px}

/* home */
.hero{padding:8px 0 4px}
.today{border-left:8px solid var(--accent)}
.today .big{font-size:22px;font-weight:750;margin:2px 0 4px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--knee);border-radius:99px}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sched li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:10px 14px}
.sched .dn{font-weight:750;min-width:62px}

/* calendar */
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:16px;height:16px;border-radius:4px;background:var(--accent);display:inline-block}
.week h3{margin:20px 0 8px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (min-width:640px){.cal{grid-template-columns:repeat(7,minmax(0,1fr))}}
.day{position:relative;min-height:78px;border-radius:12px;border:1px solid var(--line);border-top:6px solid var(--accent);background:var(--card);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:6px 10px 8px;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%}
.day .n{font-size:21px;font-weight:750;line-height:1.2}
.day .l{font-size:16px;color:var(--accent-ink);font-weight:600}
.day.done{background-color:var(--accent-soft)}
.day.done::after{content:"✓";position:absolute;top:4px;right:8px;font-weight:800;font-size:20px;color:var(--accent-ink)}
.day.is-today{box-shadow:0 0 0 3px var(--ink)}
.day.locked{background-color:transparent;border-style:dashed;border-top-style:solid}
.day.locked .n,.day.locked .l{color:var(--muted)}
.day.locked::after{content:"🔒";position:absolute;top:6px;right:8px;font-size:15px}
.donenote{margin:0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;text-align:center}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;min-height:52px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:260px}

/* session */
.shead{border-radius:18px;padding:18px 18px 16px;background:var(--accent-soft);border:1px solid var(--line);border-top:8px solid var(--accent)}
.shead h1{margin:2px 0 4px}
.prog{border:2px solid var(--accent);border-radius:16px;padding:14px 16px;background:var(--card)}
.prog h2{margin:0 0 8px;font-size:19px}
.prog ol{margin:0;padding-left:22px}
.prog li{padding:4px 6px;border-radius:8px}
.prog li.now{background:var(--accent-soft);font-weight:650}
.prog li.now::after{content:"  ← this week";color:var(--accent-ink);font-weight:750}
/* a day with two workouts: two-colour top edge */
.combo{border-top-color:transparent!important;background-image:linear-gradient(90deg,var(--c1) 50%,var(--c2) 50%);background-origin:border-box;background-size:100% var(--bt,6px);background-repeat:no-repeat}
.c-knee-post{--c1:var(--knee);--c2:var(--post)}
.c-post-knee{--c1:var(--post);--c2:var(--knee)}
.shead.combo{--bt:8px}
.legend i.two{background:linear-gradient(90deg,var(--knee) 50%,var(--post) 50%)}
.addwo .btn{flex:1 1 220px}
.workout{padding-top:10px}
.wohead{border-radius:14px;padding:12px 16px;background:var(--accent-soft);border-left:8px solid var(--accent)}
.wohead h2{margin:2px 0}
.daynav{display:flex;gap:10px}
.daynav .btn{flex:1}
.counter{font-weight:650;color:var(--muted)}
.exlist{display:grid;gap:16px}
@media (min-width:980px){.exlist{grid-template-columns:1fr 1fr;align-items:start}}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ex.ticked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.media{position:relative;background:var(--media);cursor:pointer}
.media video,.media img,.media svg{display:block;width:100%;height:auto}
.media .pill{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(15,18,20,.72);color:#fff;border-radius:999px;padding:4px 12px;font-size:16px;font-weight:600;pointer-events:none}
.media .pill.still{background:rgba(15,18,20,.55)}
.ex-body{padding:14px 16px 16px}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:750}
.dose{display:inline-block;margin:10px 0;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:750}
.how{margin:0 0 10px}
.target{margin:-2px 0 10px;color:var(--accent-ink)}
.vnote{color:var(--muted);font-size:16px;border-left:3px solid var(--line);padding-left:10px;margin:0 0 10px}
.wk{background:var(--note);color:var(--note-ink);border-radius:10px;padding:8px 12px;font-weight:650;margin:0 0 10px}
.tick{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-weight:650;margin-top:12px;user-select:none}
.tick input{width:28px;height:28px;margin:0;accent-color:var(--accent);flex:none}
.tick.on{border-color:var(--accent);background:var(--accent-soft)}

/* timer */
.timer{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:12px}
.timer .lbl{font-weight:650;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{min-height:44px;min-width:58px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:inherit;font:inherit;font-weight:650;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.clockrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-size:40px;line-height:1;font-weight:750;font-variant-numeric:tabular-nums;min-width:86px;margin-right:auto}
.timer .btn{min-height:48px;padding:10px 16px}
.timer.running{border-style:solid;border-color:var(--accent)}
.timer.running .clock{color:var(--accent-ink)}
.timer.finished{border-style:solid;border-color:var(--accent);animation:flash .5s ease-in-out 6 alternate}
@keyframes flash{to{background:var(--accent-soft)}}
.timer .hint{font-size:16px;color:var(--muted);margin:8px 0 0}

/* lists */
.plain{margin:0;padding-left:22px}
.plain li+li{margin-top:10px}
.safety section{border-left:6px solid var(--accent);background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.safety h2{margin:0 0 6px;font-size:19px}
.credits li{margin:4px 0}
.minis{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.minis{grid-template-columns:1fr 1fr}}

/* svg figures */
.fig .bg{fill:var(--media)}
.fig .b{stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .bf{stroke:var(--fig-far);stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .hd{fill:var(--fig)}
.fig .hdf{fill:var(--fig-far)}
.fig .halo{stroke:var(--media);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .lbl{fill:var(--muted);font:600 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.extra{margin:0 0 10px;border-radius:12px;overflow:hidden}
.extra svg{display:block;width:100%;height:auto}
.unlock{background:var(--card);border:2px dashed var(--accent);border-radius:16px;padding:14px 16px;margin:0 0 16px}
.unlock.on{border-style:solid;border-width:1px;border-color:var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 8px 8px 16px}
.unlock input{font:inherit;min-height:52px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);flex:1;min-width:160px}
.fig .pr{stroke:var(--prop);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .prf{fill:var(--prop)}
.fig .ar{stroke:var(--accent);fill:none;stroke-width:5;stroke-linecap:round}
.fig .arh{fill:var(--accent)}
.fig .gh{opacity:.3}
.fig .dash{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 6;fill:none;opacity:.7}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:var(--muted);text-decoration:none;font-size:16px;font-weight:600;border-top:3px solid transparent}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current=page]{color:var(--ink);border-top-color:var(--knee)}
@media (min-width:760px){.tabs{left:50%;right:auto;transform:translateX(-50%);width:600px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.timer.finished{animation:none;background:var(--accent-soft)}}
</style>
</head>

<script>
(function(){
'use strict';

/* ---------- storage (safe if localStorage is blocked) ---------- */
var KEY = 'ex30:v1';
var mem = null;
function load(){
  if (mem) return mem;
  var s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  mem = s && typeof s === 'object' ? s : {};
  mem.done = mem.done || {}; mem.ticks = mem.ticks || {}; mem.habits = mem.habits || {}; mem.extra = mem.extra || {};
  /* days now open one after another from day 1; older date-based progress starts over once */
  if (mem.seq !== 1) { mem.done = {}; mem.ticks = {}; delete mem.start; mem.seq = 1; save(); }
  return mem;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} }

/* ---------- dates ---------- */
function isoDate(d){ var m = d.getMonth()+1, day = d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
function parseISO(s){ var p = String(s||'').split('-').map(Number); if (p.length<3 || !p[0]) return null; return new Date(p[0], p[1]-1, p[2]); }
var WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(d){ return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }

/* ---------- progress: each day opens when the day before is done ---------- */
function currentDay(){ var d = load().done; for (var n=1; n<=30; n++) if (!d[n]) return n; return 31; }
function isOpen(n){ return n <= 1 || !!load().done[n-1]; }
function doneDate(n){ var v = load().done[n]; return typeof v === 'string' ? parseISO(v) : null; }

/* ---------- workouts per day: the planned one, plus a second one you add (legs + back on the same day) ---------- */
function workoutsFor(n){
  var base = dayType(n), add = load().extra[n] || [], list = base === 'rest' ? [] : [base];
  ['knee','post'].forEach(function(t){ if (add.indexOf(t) >= 0 && list.indexOf(t) < 0) list.push(t); });
  return list;
}
function dayLabel(n){ var w = workoutsFor(n); return w.length ? w.map(function(t){ return TYPE_LABEL[t]; }).join(' + ') : 'Rest'; }
function dayTitle(n){ var w = workoutsFor(n); return !w.length ? 'Rest day' : (w.length === 1 ? planFor(w[0]).title : dayLabel(n)+' day'); }
function minutesFor(list){
  if (list.length === 1) return planFor(list[0]).minutes;
  return 'about '+list.reduce(function(sum, t){ return sum + parseInt(planFor(t).minutes.replace(/\D+/g, ''), 10); }, 0)+' minutes in total';
}
function comboCls(list){ return list.length > 1 ? ' combo c-'+list[0]+'-'+list[1] : ''; }

/* ---------- schedule ---------- */
function dayType(n){
  if (n === 29) return 'knee';
  if (n === 30) return 'post';
  var d = ((n-1) % 7) + 1;
  return d === 7 ? 'rest' : (d % 2 ? 'knee' : 'post');
}
function weekOf(n){ return Math.min(4, Math.ceil(n/7)); }
var TYPE_LABEL = {knee:'Knee', post:'Posture', rest:'Rest'};

/* ---------- svg illustrations (for moves with no free photo) ---------- */
function L(x1,y1,x2,y2,w,c){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke-width="'+w+'" class="'+c+'"/>'; }
function P(pts,w,c){ return '<polyline points="'+pts+'" stroke-width="'+w+'" class="'+c+'"/>'; }
function C(x,y,r,c){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" class="'+c+'"/>'; }
function head(x1,y1,x2,y2){ var a=Math.atan2(y2-y1,x2-x1), s=13, w=.5;
  return '<polygon class="arh" points="'+x2+','+y2+' '+(x2-s*Math.cos(a-w)).toFixed(1)+','+(y2-s*Math.sin(a-w)).toFixed(1)+' '+(x2-s*Math.cos(a+w)).toFixed(1)+','+(y2-s*Math.sin(a+w)).toFixed(1)+'"/>'; }
function arrow(x1,y1,x2,y2){ var a=Math.atan2(y2-y1,x2-x1); return '<line class="ar" x1="'+x1+'" y1="'+y1+'" x2="'+(x2-8*Math.cos(a)).toFixed(1)+'" y2="'+(y2-8*Math.sin(a)).toFixed(1)+'"/>'+head(x1,y1,x2,y2); }
function curve(x1,y1,cx,cy,x2,y2){ var a=Math.atan2(y2-cy,x2-cx); return '<path class="ar" d="M'+x1+' '+y1+' Q'+cx+' '+cy+' '+(x2-8*Math.cos(a)).toFixed(1)+' '+(y2-8*Math.sin(a)).toFixed(1)+'"/>'+head(cx,cy,x2,y2); }
function N(pts,w){ return P(pts,w+8,'halo')+P(pts,w,'b'); }
function svg(inner, label, vb){ return '<svg class="fig" viewBox="'+(vb||'0 0 320 240')+'" role="img" aria-label="'+label+'"><rect class="bg" width="320" height="240"/>'+inner+'</svg>'; }

var SVG = {
  sidequad: function(){
    /* seen from above, lying on the side on a mat: bottom leg straight, top knee bent, top hand holds the heel at the glute */
    return svg(
      '<rect class="prf" x="10" y="112" width="300" height="104" rx="14" opacity=".38"/>'+
      /* bottom (far) side: arm overhead under the head, leg straight */
      P('80,176 44,182 14,182', 13, 'bf')+
      P('168,176 222,178 272,179', 16, 'bf')+ L(272,180,281,192,10,'bf')+
      /* head with a small nose cue, neck, torso, pelvis */
      C(42,168,15,'hd')+ '<path class="hd" d="M34 180 L42 190 L48 180 Z"/>'+ L(54,169,80,170,13,'b')+ L(82,170,162,171,30,'b')+ C(166,170,17,'hd')+
      /* top (near) leg: thigh slightly behind the hip line, shin folded back, heel at the glute */
      P('170,166 224,152 180,136', 17, 'b')+ L(180,136,167,131,10,'b')+
      /* top (near) arm: elbow lifted, hand holding the ankle */
      P('88,162 124,128 174,134', 13, 'halo')+ P('88,162 124,128 174,134', 11, 'b')+
      curve(240,138,232,108,200,112),
      'Side-lying quad stretch, seen from above: lying on one side, bottom leg straight, top knee bent and the heel held at the glute',
      '0 96 320 136');
  },
  walkout: function(){
    var start =
      L(72,196,124,203,12,'bf')+
      P('138,160 180,142 186,192', 16, 'bf')+ L(182,200,206,200,10,'bf')+
      L(70,194,138,160,26,'b')+ C(44,190,14,'hd')+ L(54,192,70,194,12,'b')+
      P('140,160 186,140 194,192', 17, 'b')+ L(190,200,216,200,11,'b')+
      L(74,198,122,205,12,'b');
    var end = '<g class="gh">'+
      L(70,194,142,172,26,'b')+ P('144,172 194,164 242,190', 17, 'b')+ L(240,199,254,184,11,'b')+ C(44,190,14,'hd')+'</g>';
    return svg(
      '<rect class="prf" x="16" y="208" width="288" height="7" rx="3.5"/>'+ end + start +
      arrow(206,228,262,228)+ arrow(262,228,206,228),
      'Hamstring walkout: from a glute bridge, the heels walk out in small steps and back in while the hips stay lifted',
      '0 100 320 140');
  },
  star: function(){
    /* top view: standing foot in the middle, 8 tap points around it */
    var cx = 160, cy = 90, R = 56, out = '', labels = {0:'Front',2:'Side',4:'Back',6:'Side'};

      var a = -Math.PI/2 + i*Math.PI/4, x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
      out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="dash"/>';
      out += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9" class="arh"/>';
      if (labels[i] !== undefined) {
        var lx = cx + (R+26)*Math.cos(a), ly = cy + (R+22)*Math.sin(a) + 6;
        out += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" class="lbl">'+labels[i]+'</text>';
      }
    }
    return '<svg class="fig" viewBox="0 0 320 206" role="img" aria-label="Top view of the star: stand on one foot in the middle and tap the floor at 8 points around you"><rect class="bg" width="320" height="206"/>'+out+

  if (t.dataset.tick) {
    var day = (location.hash.match(/day\/(\d+)/)||[])[1]; if (!day) return;
    st.ticks[day] = st.ticks[day] || {};
    if (t.checked) st.ticks[day][t.dataset.tick] = true; else delete st.ticks[day][t.dataset.tick];
    save();
    t.closest('.tick').classList.toggle('on', t.checked);
    t.closest('.ex').classList.toggle('ticked', t.checked);
    var c = document.getElementById('counter');
    if (c) c.textContent = app.querySelectorAll('[data-tick]:checked').length+' of '+c.dataset.total+' exercises ticked';
  } else if (t.dataset.habit) {
    var key = isoDate(new Date()); st.habits[key] = st.habits[key] || {};
    if (t.checked) st.habits[key][t.dataset.habit] = true; else delete st.habits[key][t.dataset.habit];
    save(); t.closest('.tick').classList.toggle('on', t.checked);
  }
});

document.addEventListener('submit', function(e){
  if (e.target.id !== 'unlockForm') return;
  e.preventDefault();
  var inp = document.getElementById('unlockPass'), msg = document.getElementById('unlockMsg');
  var pass = (inp.value || '').trim().toLowerCase();
  if (!pass) return;
  if (msg) msg.textContent = 'Checking…';
  unlockWith(pass, false);
});

document.addEventListener('visibilitychange', function(){ if (!document.hidden && T.running) { tick(); wakeOn(); } });

route();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
